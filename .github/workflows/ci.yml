name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (build / vet / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: web/go.mod
          cache: false            # stdlib-only module, no go.sum to key a cache on
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse bash scripts
        run: |
          bash -n t-forward
          bash -n entrypoint.sh
      - name: shellcheck
        # gate on warning+; info/style nags are opinionated and vary by
        # shellcheck version, which would make CI flaky across runner updates
        run: shellcheck --severity=warning t-forward entrypoint.sh
