name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (build / vet / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: web/go.mod
          check-latest: true      # newest patch of the go.mod series, not the runner's cached one
          cache: false            # stdlib-only module, no go.sum to key a cache on
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - name: govulncheck
        # fails on any reachable vulnerability in the stdlib the daemon is
        # built with (the module has no third-party dependencies)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse bash scripts
        run: |
          bash -n t-forward
          bash -n entrypoint.sh
      - name: shellcheck
        # gate on warning+; info/style nags are opinionated and vary by
        # shellcheck version, which would make CI flaky across runner updates
        run: shellcheck --severity=warning t-forward entrypoint.sh

  python-helpers:
    name: Python helpers (unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: unittest web/helpers
        # the helpers are stdlib-only; test_totp_imap imports totp_imap as a
        # top-level module, so run from inside the folder
        working-directory: web/helpers
        run: python -m unittest -v test_totp_imap

  tofu-regression:
    name: TOFU pin on restart (docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image under test
        run: docker build -t t-forward:test .
      - name: tests/tofu-restart.sh
        # needs docker, python3 and openssl on the runner (all preinstalled)
        run: tests/tofu-restart.sh t-forward:test
