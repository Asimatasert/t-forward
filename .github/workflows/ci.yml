name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (build / vet / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: web/go.mod
          check-latest: true      # newest patch of the go.mod series, not the runner's cached one
          cache: false            # stdlib-only module, no go.sum to key a cache on
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - name: govulncheck
        # fails on any reachable vulnerability in the stdlib the daemon is
        # built with (the module has no third-party dependencies)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Parse bash scripts
        run: |
          bash -n t-forward
          bash -n entrypoint.sh
      - name: shellcheck
        # gate on warning+; info/style nags are opinionated and vary by
        # shellcheck version, which would make CI flaky across runner updates
        run: shellcheck --severity=warning t-forward entrypoint.sh
