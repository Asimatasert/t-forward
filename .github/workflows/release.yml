name: Release

# Fires when a version tag is pushed (e.g. `v0.7.0`). It publishes the
# multi-arch tunnel image to Docker Hub and attaches the built binaries to the
# GitHub release. Deploying the web daemon to the private server stays manual —
# that host is only reachable over the internal network, not from CI runners.
on:
  push:
    tags: ['v*']

permissions:
  contents: read    # least privilege; only the release job below gets write

env:
  IMAGE: asimatasert/t-forward

jobs:
  docker:
    name: Docker Hub (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Docker push needs the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repo secrets.
      # Until they're set the whole job stays green but skips the push, so a
      # release still produces its GitHub artifacts.
      - id: check
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DOCKERHUB_TOKEN not set — skipping Docker Hub push"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Version from tag
        id: ver
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.ok == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - if: steps.check.outputs.ok == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.check.outputs.ok == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: steps.check.outputs.ok == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # attach build provenance and an SBOM to the image so consumers can
          # tell what was built, from which commit
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.v }}
            ${{ env.IMAGE }}:latest

  release:
    name: GitHub release + binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create / update the GitHub release (this job only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: web/go.mod
          check-latest: true
          cache: false
      - name: Build web daemon (linux amd64 + arm64)
        run: |
          mkdir -p dist
          cd web
          VERSION="${GITHUB_REF_NAME#v}"
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o ../dist/t-forward-web-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version=${VERSION}" -o ../dist/t-forward-web-linux-arm64 .
      - name: Stage CLI script
        run: cp t-forward dist/t-forward
      - name: Publish release
        # the preinstalled gh CLI with the job's own GITHUB_TOKEN instead of a
        # third-party action holding a write token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/t-forward-web-linux-amd64 dist/t-forward-web-linux-arm64 dist/t-forward)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
