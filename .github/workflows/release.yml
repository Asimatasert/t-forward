name: Release

# Fires when a version tag is pushed (e.g. `v0.7.0`). It publishes the
# multi-arch tunnel image to Docker Hub and attaches the built binaries to the
# GitHub release. Deploying the web daemon to the private server stays manual —
# that host is only reachable over the internal network, not from CI runners.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create / update the GitHub release

env:
  IMAGE: asimatasert/t-forward

jobs:
  docker:
    name: Docker Hub (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Docker push needs the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repo secrets.
      # Until they're set the whole job stays green but skips the push, so a
      # release still produces its GitHub artifacts.
      - id: check
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DOCKERHUB_TOKEN not set — skipping Docker Hub push"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Version from tag
        id: ver
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.ok == 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.check.outputs.ok == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.check.outputs.ok == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: steps.check.outputs.ok == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.v }}
            ${{ env.IMAGE }}:latest

  release:
    name: GitHub release + binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: web/go.mod
          cache: false
      - name: Build web daemon (linux amd64 + arm64)
        run: |
          mkdir -p dist
          cd web
          VERSION="${GITHUB_REF_NAME#v}"
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o ../dist/t-forward-web-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version=${VERSION}" -o ../dist/t-forward-web-linux-arm64 .
      - name: Stage CLI script
        run: cp t-forward dist/t-forward
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/t-forward-web-linux-amd64
            dist/t-forward-web-linux-arm64
            dist/t-forward
